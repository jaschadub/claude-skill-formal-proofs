# Copy to .github/workflows/formal-proofs.yml in a project that has a VERIFY.md record.
# The job fails when verified code changed without a re-sync of its record, when a model breaks a rule,
# when a deliberate fault no longer breaks its rule, or when a model cannot follow the log of a real run.
name: formal-proofs
on: [push, pull_request]
# For many runs of the real code against the model, add a nightly run, and a step before the action that
# writes one log for each run into a folder. Then give that folder as the LOG of `traces`.
#   schedule:
#     - cron: "0 3 * * *"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # so that a failure can list the commits since the last sync
      - uses: jaschadub/skill-formal-proofs@v0.5.1
        with:
          specs: formal/session/Session.tla # your models, separated by spaces
          # faults: formal/session/Session.tla:no_lock=NoSpentTokenSent # each fault of the record with a rule that it must break, once for each rule
          # traces: formal/session/SessionTrace.tla=target/trace.log # a log, or a folder of logs, after the step that writes it
