schema_version: "1.1"
name: maintain-rename
description: The last commit renames a variable in covered code. Nothing that the model describes changed.
tags: [maintain]
execution:
  prompt: The last commit in counter/ changed code that a formal verification covers. Check that the verification still holds.
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
  disallowed_tools: [AskUserQuestion, Agent]
context:
  scaffold_script: fixture.sh
graders:
  - name: ran-drift
    type: tool_used
    tool: Bash
    input_match: "drift\\.sh"
  - name: leaves-code-alone
    type: tool_used
    tool: Edit
    input_match: "counter\\.py"
    min: 0
    max: 0
  - name: not-a-bug
    type: llm
    criteria: >-
      The reply says that the last commit only renamed a variable in hit(), that this changes
      nothing the model describes, and that NoLostHit still holds. It reports the check as in
      sync or updated, not as a bug.
