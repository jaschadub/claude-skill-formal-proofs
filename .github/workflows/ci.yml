name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: shellcheck hooks/*.sh skills/tla-check/*.sh skills/maintain-formal-verification/*.sh examples/counter-rs/*.sh evals/*.sh evals/*/*.sh
      - run: sh skills/tla-check/test.sh
      - run: sh skills/maintain-formal-verification/test.sh
      - run: sh hooks/test.sh
      - name: Chart scripts pass the strict type check and their tests
        working-directory: skills/statechart/scripts
        run: npm install --no-package-lock --no-audit --no-fund && npm test
      - name: The Pi extension adds the reminder to an edit
        run: node --test pi/remind.test.ts
      - name: Every manifest parses, five carry the same version, and the docs and the changelog name it
        run: |
          manifests=".claude-plugin/plugin.json .claude-plugin/marketplace.json .codex-plugin/plugin.json .cursor-plugin/plugin.json .agents/plugins/marketplace.json package.json hooks/hooks.json"
          for file in $manifests hooks/cursor.json; do python3 -m json.tool "$file" > /dev/null; done
          versions=$(grep -h '"version"' $manifests | tr -d ' ,')
          test "$(echo "$versions" | wc -l)" = 5
          test "$(echo "$versions" | sort -u | wc -l)" = 1
          version=$(echo "$versions" | head -n 1 | cut -d'"' -f4)
          grep -q "skill-formal-proofs@v$version\$" README.md
          grep -q "skill-formal-proofs@v$version\$" examples/github-workflow.yml
          grep -q "^## $version - " CHANGELOG.md
      - name: The Rust example passes its checks, and its fault breaks them
        run: |
          cargo clippy --manifest-path examples/counter-rs/Cargo.toml --all-targets --features trace -- -D warnings
          sh examples/counter-rs/test.sh
      # The same step that a project adds to its own CI; see examples/github-workflow.yml.
      - name: Check the example records, model, fault, and trace with the action
        uses: ./
        with:
          specs: examples/counter/Counter.tla
          faults: examples/counter/Counter.tla:no_lock=NoLostHit
          traces: examples/counter/CounterTrace.tla=examples/counter-rs/target/trace.log
